spring.application.name=assignment-service
server.port=8084

eureka.client.service-url.defaultZone=${EUREKA_URL:http://discovery-server:8761/eureka/}

spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${ASSIGNMENT_DB_URL:jdbc:postgresql://postgres:5432/assignment_db}
spring.datasource.username=transport_user
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
logging.structured.format.console=logstash
